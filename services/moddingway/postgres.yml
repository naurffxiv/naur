# include:
#   - path:
#       - postgres.override.yml

services:
  postgres_local:
    container_name: postgres_db
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_ephemeral:
    container_name: postgres_db_ephemeral
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Throwaway database for the integration tests (python-test). Fixed
  # credentials so tests need no secrets; no host port is published.
  postgres_test:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=moddingwayTestPassword
      - POSTGRES_USER=moddingwayTest
      - POSTGRES_DB=moddingway_test
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./postgres/create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
    healthcheck:
      # -h forces TCP, which only comes up after the init scripts have run
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -d moddingway_test -U moddingwayTest"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
