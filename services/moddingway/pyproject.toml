[project]
name = "moddingway"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "discord==2.3.2",
    "pydantic==2.14.2",
    "psycopg2==2.9.13",
    "fastapi[standard]==0.162.0",
    "uvicorn==0.54.0",
    "fastapi-pagination==0.16.1",
    "python-dotenv==1.2.4",
    "anyio==4.15.1",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
    "ty==0.0.95",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "T20", # flake8-print
]

ignore = [
    "E501",    # Line too long
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["moddingway", "moddingway_api"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ty.environment]
python-version = "3.14"
root = ["../../", "."]  # repo root for tests/, service root for moddingway/

[tool.ty.src]
include = ["moddingway", "moddingway_api", "main.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
required-version = "==0.13.5"
