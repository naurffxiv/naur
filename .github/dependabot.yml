version: 2
registries:
  davidfowl-aspire:
    type: nuget-feed
    url: https://f.feedz.io/davidfowl/aspire/nuget/index.json
# Security updates only: open-pull-requests-limit: 0 turns off version updates for
# each ecosystem. Security update PRs have their own limit and still open.
# schedule is required by the schema but does not affect security updates.
# https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/configuring-dependabot-security-updates
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/services/naurffxiv"
      - "/tests/e2e"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "nuget"
    directory: "/"
    registries:
      - davidfowl-aspire
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/services/moddingway"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directories:
      - "/services/findingway"
      - "/services/clearingway"
      - "/services/clearingway_legacy"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/services/clearingway_legacy"
      - "/services/findingway"
      - "/services/moddingway/moddingway"
      - "/services/moddingway/moddingway_api"
      - "/services/naurffxiv"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
