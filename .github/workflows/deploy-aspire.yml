name: Deploy Aspire

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-aspire.yml"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "global.json"
      - "services/apphost/**"
      - "services/authingway/**"

concurrency:
  group: aspire-deploy-authingway
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Service Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apphost: ${{ steps.filter.outputs.apphost }}
      authingway: ${{ steps.filter.outputs.authingway }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            _shared: &shared
              - '.github/workflows/deploy-aspire.yml'
              - 'Directory.Packages.props'
              - 'NuGet.config'
              - 'global.json'
            apphost:
              - *shared
              - 'services/apphost/**'
            authingway:
              - *shared
              - 'services/authingway/**'

  deploy:
    needs: [detect-changes]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.apphost == 'true' ||
      needs.detect-changes.outputs.authingway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Authingway
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: services/apphost

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: zyactions/dotnet-setup@8f4b644ff5ff19bba913663df285b7b7278bb724 # v1.0.1
        with:
          global-json-file: global.json

      - name: Install Aspire CLI
        run: curl -sSL https://aspire.dev/install.sh | bash

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log the server in to GitHub Container Registry
        env:
          SERVER: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | ssh "$SERVER" docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Deploy
        env:
          Parameters__PostgresPassword: ${{ secrets.AUTHINGWAY_POSTGRES_PASSWORD }}
          Parameters__DiscordToken: ${{ secrets.AUTHINGWAY_DISCORD_TOKEN }}
          Parameters__CloudflareToken: ${{ secrets.AUTHINGWAY_CLOUDFLARE_TOKEN }}
          Parameters__DiscordGuildId: ${{ vars.AUTHINGWAY_DISCORD_GUILD_ID || '0' }}
          Parameters__DiscordMigrationChannelId: ${{ vars.AUTHINGWAY_MIGRATION_CHANNEL_ID || '0' }}
          Parameters__DiscordDeveloperRoleId: ${{ vars.AUTHINGWAY_DEVELOPER_ROLE_ID || '0' }}
          DockerSSH__TargetHost: ${{ secrets.SERVER_HOST }}
          DockerSSH__SshUsername: ${{ secrets.SERVER_USER }}
          DockerRegistry__RegistryUrl: ghcr.io
          DockerRegistry__RepositoryPrefix: ${{ github.repository }}
        run: aspire deploy -e production
